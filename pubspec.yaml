name: myappaffiliate_flutter
description: >-
  MyAppAffiliate attribution SDK for Flutter — first-party, deterministic
  affiliate attribution with zero tracking. Stores a stable device id, records
  attribution from a link or manual code, and hands you the attributed
  affiliate id to pass into your billing layer.
version: 0.2.0
homepage: https://myappaffiliate.com
repository: https://github.com/myappaffiliate/myappaffiliate-flutter
issue_tracker: https://github.com/myappaffiliate/myappaffiliate-flutter/issues
documentation: https://docs.myappaffiliate.com/sdk-flutter

topics:
  - affiliate
  - attribution
  - referral
  - analytics

platforms:
  android:
  ios:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
